name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly regression, 08:17 Tashkent
  workflow_dispatch:
    inputs:
      groups:
        description: "JUnit tags to run (e.g. payments, booking). Empty = all"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          TEST_TAGS: ${{ github.event.inputs.groups }}
        run: |
          if [ -n "$TEST_TAGS" ]; then
            mvn -B -ntp test -Dgroups="$TEST_TAGS"
          else
            mvn -B -ntp test
          fi

      - name: Build Allure report
        if: always()
        run: mvn -B -ntp allure:report

      - name: Upload report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
